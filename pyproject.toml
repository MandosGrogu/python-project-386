[project]
name = "call-calendar"
version = "0.1.0"
description = "Сервис бронирования календаря звонков"
readme = "README.md"
authors = [
    { name = "MandosGrogu", email = "jpinkmann@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-tailwind-cli>=4.8.0",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "tailwind>=3.1.5b0",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "model-bakery>=1.18",
    "openapi-spec-validator>=0.9.0",
]
